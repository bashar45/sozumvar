server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # /gizlilik ve /gizlilik.html ikisi de çalışsın
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Meta'nın inceleme botu sayfayı okuyabilmeli
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer-when-downgrade;

    # Fontlar kendi sunucumuzdan (Google Fonts yok). Dosya adları değişmediği
    # sürece içerik de değişmez, uzun süre önbellekte kalabilir.
    # Not: location içindeki add_header, sunucu düzeyindekileri devre dışı
    # bırakır; güvenlik başlıkları bu yüzden burada tekrar yazıldı.
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer-when-downgrade;
        types { font/woff2 woff2; text/plain txt; }
    }

    location /img/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer-when-downgrade;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
